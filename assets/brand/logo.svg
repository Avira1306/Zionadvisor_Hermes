<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 84" width="440" height="84" role="img" aria-label="Zion Advisor — M&amp;A databooks and financial due diligence">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9a8"/>
      <stop offset="55%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a5842f"/>
    </linearGradient>
  </defs>

  <!-- Mark: ledger-Z inside a thin brass frame -->
  <g transform="translate(6,10)">
    <rect x="0.9" y="0.9" width="62.2" height="62.2" rx="7"
          fill="#111111" stroke="url(#brass)" stroke-width="1.6"/>
    <!-- Z: top rail, stepped diagonal, bottom rail -->
    <rect x="17" y="17" width="30" height="5.2" rx="1" fill="url(#brass)"/>
    <path d="M45.4 23.6 L36.4 32 L28.2 32 L19.2 40.4"
          fill="none" stroke="url(#brass)" stroke-width="5.2"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="17" y="41.8" width="30" height="5.2" rx="1" fill="url(#brass)"/>
  </g>

  <!-- Wordmark -->
  <text x="86" y="43"
        font-family="'DM Serif Display', 'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="31" letter-spacing="1.6" fill="#f5f2ea">ZION<tspan fill="url(#brass)"> ADVISOR</tspan></text>

  <!-- Rule -->
  <rect x="87" y="52" width="196" height="1" fill="#c9a84c" opacity="0.45"/>

  <!-- Tagline -->
  <text x="87" y="66"
        font-family="'Fira Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="9.4" letter-spacing="3.1" fill="#9aa1ad">M&#38;A DATABOOKS &#183; FINANCIAL DUE DILIGENCE</text>
</svg>
